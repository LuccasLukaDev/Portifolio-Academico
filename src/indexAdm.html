<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo</title>

    <link rel="stylesheet" href="styleAdm.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

    <div class="form-container">

        <h1>Painel Administrativo</h1>
        <button class="btn-voltar" onclick="voltarIndex()">
            <i class="fa-solid fa-arrow-left"></i>
        </button>

        <!-- FORMAÇÃO -->

        <div class="painel">

            <h2>Adicionar Formação</h2>

            <form id="formFormacao">

                <div class="form-group">
                    <label>Instituição</label>
                    <input type="text" id="instituicao" required>
                </div>

                <div class="form-group">
                    <label>Nível</label>
                    <input type="text" id="nivel" required>
                </div>

                <div class="form-group">
                    <label>Curso</label>
                    <input type="text" id="curso" required>
                </div>

                <div class="form-group">
                    <label>Ano Início</label>
                    <input type="number" id="inicio" required>
                </div>

                <div class="form-group">
                    <label>Ano Final</label>
                    <input type="number" id="fim">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="atual">
                    <label>Atualmente cursando</label>
                </div>

                <div class="botoes">
                    <button class="salvar" type="submit">Salvar</button>
                </div>

            </form>

        </div>


        <!-- CURSOS -->

        <div class="painel">

            <h2>Adicionar Certificado</h2>

            <form id="formCurso">

                <div class="form-group">
                    <label>Imagem</label>
                    <input type="file" id="imagem" required>
                </div>

                <div class="botoes">
                    <button class="salvar" type="submit">Salvar</button>
                </div>

            </form>

        </div>


        <!-- PROJETOS -->

        <div class="painel">

            <h2>Adicionar Projeto</h2>

            <form id="formProjeto">

                <div class="form-group">
                    <label>Imagem do Projeto</label>
                    <input type="file" id="imagemProjeto" required>
                </div>

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nomeProjeto" required>
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="descricaoProjeto" required>
                </div>

                <div class="form-group">
                    <label>Link do Repositório</label>
                    <input type="url" id="linkProjeto" required>
                </div>

                <div class="botoes">
                    <button class="salvar" type="submit">Salvar</button>
                </div>

            </form>

        </div>


        <!-- COMPETÊNCIAS -->

        <div class="painel">

            <h2>Adicionar Competência</h2>

            <form id="formCompetencia">

                <div class="form-group">
                    <label>Competência</label>
                    <input type="text" id="nomeCompetencia" required>
                </div>

                <div class="botoes">
                    <button class="salvar" type="submit">Salvar</button>
                </div>

            </form>

        </div>


        <!-- LINKS -->

        <div class="painel">

            <h2>Adicionar Link</h2>

            <form id="formLink">

                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nomeLink" required>
                </div>

                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="descricaoLink" required>
                </div>

                <div class="form-group">
                    <label>URL</label>
                    <input type="url" id="urlLink" required>
                </div>

                <div class="botoes">
                    <button class="salvar" type="submit">Salvar</button>
                </div>

            </form>

        </div>

    </div>

    <script src="scriptAdm.js"></script>

</body>

</html>
